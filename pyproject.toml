[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-cli-campaigns"
version = "0.1.0"
description = "Multi-repo rollout framework for Azure CLI campaigns (e.g. Python upgrade)."
requires-python = ">=3.11"
# Runtime dependencies: stdlib only. The framework shells out to `gh` and
# `git`, so those must be on PATH.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["campaigns*"]
